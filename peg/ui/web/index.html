<!doctype html>
<meta charset="utf-8">
<title>PEG</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2312140f'/><rect x='2' y='9' width='12' height='5' fill='%236e5842'/><circle cx='6' cy='6' r='3' fill='%23305c3c'/></svg>">
<style>
  :root {
    --bg:#0f1310; --panel:#161b16; --panel2:#1d231d; --line:#2c342c;
    --ink:#e4e8dc; --dim:#8d967f; --hot:#e2a04d; --good:#93c05a;
    --bad:#d15f45; --acc:#e0b93c; --blue:#6fa8d6;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--ink); overflow:hidden;
    font:13px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  #app { display:flex; height:100vh; }
  #stage { flex:1; position:relative; min-width:0; background:#0b0f0b; }
  #c { display:block; width:100%; height:100%; cursor:grab; }
  #c.dragging { cursor:grabbing; }

  /* ---------- top bar ---------- */
  #top {
    position:absolute; top:0; left:0; right:0; display:flex; flex-wrap:wrap;
    align-items:center; gap:8px; padding:9px 12px; z-index:5;
    background:linear-gradient(rgba(8,11,8,.96),rgba(8,11,8,.82),transparent);
  }
  /* The place name is the answer to "where am I", so it gets a real minimum
     and the controls wrap instead of crushing it to a sliver. */
  #where { flex:1 1 260px; min-width:200px; }
  #where b { font-size:15px; font-weight:650; display:block;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #where span { display:block; color:var(--dim); font-size:11.5px;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .seg { display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { border:0; border-radius:0; border-right:1px solid var(--line); }
  .seg button:last-child { border-right:0; }
  button {
    font:inherit; font-size:12.5px; color:var(--ink); background:#232a23;
    border:1px solid var(--line); padding:7px 11px; border-radius:6px;
    cursor:pointer; white-space:nowrap;
  }
  button:hover { background:#2e372e; }
  button[aria-pressed="true"] { background:var(--acc); color:#161200; font-weight:650; }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--acc); color:#161200; font-weight:650; border-color:var(--acc); }
  button.primary:hover { filter:brightness(1.08); }

  .pill {
    background:rgba(16,20,16,.9); border:1px solid var(--line);
    padding:6px 10px; border-radius:6px; white-space:nowrap; font-size:12.5px;
  }

  /* ---------- bottom-left cluster ---------- */
  #bl { position:absolute; left:12px; bottom:12px; z-index:5;
        display:flex; align-items:flex-end; gap:10px; }
  #mini { border:1px solid var(--line); border-radius:6px; background:#0b0f14;
          display:block; cursor:pointer; }
  #minilabel { position:absolute; left:8px; bottom:4px; font-size:10px;
               color:rgba(255,255,255,.75); pointer-events:none; text-shadow:0 1px 2px #000; }
  #scalebar { background:rgba(16,20,16,.9); border:1px solid var(--line);
              padding:6px 10px; border-radius:6px; font-size:11px; }
  #scalebar i { display:block; height:5px; border:1px solid var(--ink);
                border-top:none; margin-top:4px; }
  #hint { position:absolute; right:12px; bottom:12px; z-index:5; color:var(--dim);
          font-size:11px; text-align:right; line-height:1.8; text-shadow:0 1px 3px #000; }

  /* ---------- side panel ---------- */
  #side { width:340px; flex:none; background:var(--panel); border-left:1px solid var(--line);
          overflow-y:auto; padding:0 0 20px; }
  .sec { padding:12px 14px; border-bottom:1px solid var(--line); }
  h2 { font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
       color:var(--dim); margin:0 0 8px; font-weight:700; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:2px 0; font-size:12.5px; }
  .row > :last-child { color:#fff; text-align:right; }
  .dim { color:var(--dim); }

  .stat { margin-bottom:9px; }
  .stat .lab { display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:3px; }
  .bar { height:7px; background:#0a0d0a; border-radius:4px; overflow:hidden; }
  .bar > i { display:block; height:100%; border-radius:4px; transition:width .25s; }

  .obj { display:flex; gap:9px; padding:8px 0; border-bottom:1px solid #232a23; }
  .obj:last-child { border-bottom:0; }
  .obj .tag { flex:none; width:44px; font-size:9.5px; font-weight:700; letter-spacing:.06em;
              text-transform:uppercase; padding-top:2px; }
  .obj .t { font-weight:600; font-size:12.5px; }
  .obj .w { color:var(--dim); font-size:11.5px; }
  .u-now  .tag { color:var(--bad); }
  .u-soon .tag { color:var(--hot); }
  .u-later .tag { color:var(--dim); }

  table { width:100%; border-collapse:collapse; font-size:11.5px; }
  td { padding:3px 3px; vertical-align:top; }
  .me td { color:var(--acc); font-weight:700; }
  #intel div, #log div { padding:4px 0; border-bottom:1px solid #232a23;
                         font-size:11px; color:var(--dim); }
  .pers { padding:6px 0; border-bottom:1px solid #232a23; font-size:12px; }
  .pers:last-child { border-bottom:0; }
  .pers .pn { display:flex; gap:6px; align-items:baseline; }
  .pers .pn b { font-weight:650; }
  .pers .pn i { margin-left:auto; font-style:normal; color:var(--acc); font-size:11px; }
  .pers .dim { font-size:11px; }
  .pers .ties { font-size:10.5px; color:#6f7a63; }

  .legend { display:grid; grid-template-columns:repeat(2,1fr); gap:3px 10px; font-size:11px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px;
              margin-right:6px; vertical-align:-1px; }

  /* ---------- overlays ---------- */
  .modal { position:absolute; inset:0; z-index:20; display:grid; place-items:center;
           background:rgba(6,8,6,.9); padding:24px; }
  /* `display:grid` beats the `hidden` attribute, so a hidden overlay stays
     laid out and silently eats every click on the map. */
  .modal[hidden] { display:none; }
  .card { max-width:620px; background:var(--panel2); border:1px solid var(--line);
          border-radius:10px; padding:26px 28px; }
  .card h1 { margin:0 0 4px; font-size:22px; letter-spacing:.01em; }
  .card h3 { margin:20px 0 6px; font-size:11px; letter-spacing:.16em;
             text-transform:uppercase; color:var(--dim); }
  .card p { margin:8px 0; font-size:13.5px; line-height:1.65; }
  .card .kv { display:grid; grid-template-columns:120px 1fr; gap:4px 14px; font-size:13px; }
  .card .kv b { color:#fff; font-weight:600; }
  .card em { color:var(--acc); font-style:normal; }
  #loading { position:absolute; inset:0; z-index:30; display:grid; place-items:center;
             background:var(--bg); font-size:14px; color:var(--dim); }
  #toast { position:absolute; top:60px; left:50%; transform:translateX(-50%); z-index:10;
           background:rgba(16,20,16,.95); border:1px solid var(--acc); color:var(--ink);
           padding:9px 16px; border-radius:6px; font-size:13px; display:none; }
</style>

<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>

    <div id="top">
      <div id="where"><b>—</b><span>—</span></div>
      <div class="seg" id="planes"></div>
      <div class="pill mono" id="clock">—</div>
      <div class="pill" id="wx">—</div>
      <button id="btnCentre" title="centre on your people (C)">Find my people</button>
      <div class="seg">
        <button id="step">+1 hour</button>
        <button id="day" class="primary">+1 day</button>
        <button id="week">+7 days</button>
      </div>
    </div>

    <div id="bl">
      <div style="position:relative">
        <canvas id="mini" width="300" height="150" title="where you are on Earth"></canvas>
        <div id="minilabel">Earth — you are the gold dot</div>
      </div>
      <div id="scalebar"></div>
    </div>

    <div id="hint">
      drag or <b>WASD</b> to pan &nbsp;·&nbsp; scroll to zoom<br>
      <b>Tab</b> switch plane &nbsp;·&nbsp; <b>C</b> centre on people<br>
      click a tile to inspect &nbsp;·&nbsp; <b>[ ]</b> move the slice
    </div>

    <div id="toast"></div>
    <div class="modal" id="brief" hidden><div class="card" id="briefBody"></div></div>
    <div class="modal" id="over" hidden><div class="card"><h1 id="overT"></h1><p id="overP"></p></div></div>
    <div id="loading">building the world…</div>
  </div>

  <div id="side">
    <div class="sec"><h2>What to do next</h2><div id="objectives"></div></div>
    <div class="sec"><h2>Colony</h2><div id="colony"></div></div>
    <div class="sec"><h2>Your people</h2><div id="people"></div></div>
    <div class="sec" id="tilesec" hidden><h2>Selected tile</h2><div id="tile"></div></div>
    <div class="sec"><h2>This site</h2><div id="site"></div></div>
    <div class="sec"><h2>Rival networks</h2><table id="standings"></table></div>
    <div class="sec"><h2>Intercepted planning</h2><div id="intel"></div></div>
    <div class="sec"><h2>Log</h2><div id="log"></div></div>
    <div class="sec"><h2>Legend</h2><div class="legend" id="legend"></div></div>
  </div>
</div>

<script>
"use strict";

/* ===========================================================================
   Axes: X = east, Z = north, Y = up. The top-down view is the X/Z plane; the
   two cross-sections put Y on the vertical. The server speaks the same
   convention, so nothing is transposed anywhere in this file.

   Rendering: the whole site is fetched once (a 160 m site is 167 KiB) and
   baked into an offscreen canvas at one pixel per tile. Panning and zooming
   are then a single scaled drawImage, with detail drawn only for tiles that
   are actually on screen. The first version re-fetched a viewport from Python
   on every pan and issued 25,600 fillRects per frame, which is exactly as slow
   as it sounds.
   =========================================================================== */

const cv = document.getElementById("c");
const ctx = cv.getContext("2d", { alpha:false });

const S = {
  plane:"xz", scale:13, camX:0, camZ:0, slice:0,
  legend:null, site:null, status:null,
  actors:[], animals:[], structures:[], fields:[],
  sel:null, hover:null, busy:false, dirty:true, size:160,
};

let baked = null, bakedCtx = null;

const api = async (p, o) => {
  const r = await fetch(p, o);
  if (!r.ok) throw new Error(p + " -> " + r.status);
  return r.json();
};
const unb64 = s => {
  const b = atob(s), o = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) o[i] = b.charCodeAt(i);
  return o;
};
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const esc = t => String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const rgb = a => `rgb(${a[0]},${a[1]},${a[2]})`;
const shade = (a,f) => `rgb(${clamp(a[0]*f|0,0,255)},${clamp(a[1]*f|0,0,255)},${clamp(a[2]*f|0,0,255)})`;
const mark = () => { S.dirty = true; };

/* ------------------------------------------------------------- sprites --- */
/* Hand-drawn pixel art, authored here rather than fetched.
   Nothing is loaded from a CDN and no image files ship: a sprite is rows of
   characters indexing a palette, painted once into a cached canvas and then
   blitted. That keeps the whole game one dependency-free file that works
   offline, and it means a colonist's coat can be recoloured per person
   without needing a separate sheet for every combination.

   Lower-case letters are palette slots that callers may override -- s skin,
   h hair, c coat, p trousers -- which is how eight colonists come out looking
   like eight different people from one drawing. */

const SPR = {};
function spr(name, pal, rows) {
  SPR[name] = { pal, rows, w: rows[0].length, h: rows.length };
}

const OUT = "#161a14";            // the outline every sprite shares

/* --- people. Four facings, seen from above and slightly behind, so the
   shoulders read and you can tell which way someone is walking. --- */
const PPAL = { o: OUT, s: "#d9a374", h: "#3b2a1c", c: "#7d6a4f",
               p: "#4a4235", b: "#2c261d", e: "#20241c", w: "#efeade" };

spr("man_s", PPAL, [
  "....oooo....",
  "..oohhhhoo..",
  ".ohhhhhhhho.",
  ".ohhhhhhhho.",
  ".ohsssssssho",
  ".osseseesso.",
  "..osssssso..",
  ".ocoossooco.",
  "occcccccccco",
  "occcccccccco",
  ".occcccccco.",
  "..opppppo...",
  "..opppppo...",
  "..obo.obo...",
]);
spr("man_n", PPAL, [
  "....oooo....",
  "..oohhhhoo..",
  ".ohhhhhhhho.",
  ".ohhhhhhhho.",
  ".ohhhhhhhho.",
  ".ohhhhhhhho.",
  "..ohhhhhho..",
  ".ocoohhooco.",
  "occcccccccco",
  "occcccccccco",
  ".occcccccco.",
  "..opppppo...",
  "..opppppo...",
  "..obo.obo...",
]);
spr("man_e", PPAL, [
  "...oooo.....",
  "..ohhhho....",
  ".ohhhhhho...",
  ".ohhhhssoo..",
  ".ohhsssseo..",
  ".ohsssssso..",
  "..ossssso...",
  "..ocoosso...",
  ".occccccco..",
  ".occcccccco.",
  ".occccccco..",
  "..opppppo...",
  "..opppppo...",
  "...oboobo...",
]);

/* --- trees. Real canopy shapes, because a conifer and an oak do not look
   remotely alike from above and the map should say which is which. --- */
spr("conifer", { o: "#12180f", d: "#1f3a1d", m: "#2c5228", l: "#3d6d33",
                 t: "#402d1c" }, [
  "......o.....",
  ".....odo....",
  ".....dml....",
  "....odmml...",
  "....dmmml...",
  "...odmmmll..",
  "...dmmmmll..",
  "..odmmmmmll.",
  "..dmmmmmmll.",
  ".odmmmmmmmll",
  ".dmmmmmmmmll",
  "odmmmmmmmmml",
  "....otto....",
  "....otto....",
]);
spr("broadleaf", { o: "#12180f", d: "#254a1f", m: "#37692c", l: "#4c8c39",
                   t: "#4a3520" }, [
  "...oooooo...",
  "..odmmmmlo..",
  ".odmmmllllo.",
  "odmmmmlllllo",
  "odmmmmmllllo",
  "odmmmmmmlllo",
  "odmmmmmmlllo",
  "odmmmmmmmllo",
  ".odmmmmmllo.",
  "..odmmmmlo..",
  "...oommoo...",
  "....otto....",
  "....otto....",
  "...ooooo....",
]);
spr("shrub", { o: "#141a11", d: "#2e4f22", m: "#43703a", l: "#5c9147" }, [
  "............",
  "............",
  "....oooo....",
  "..oodmmloo..",
  ".odmmmlllo..",
  ".odmmmmlllo.",
  "odmmmmmmlllo",
  ".odmmmmmllo.",
  "..oodmmloo..",
  "....oooo....",
  "............",
  "............",
]);
spr("palm", { o: "#12180f", d: "#26521f", m: "#3a7a2c", l: "#57a03c",
              t: "#6b4a29" }, [
  "..o......o..",
  ".odm....mdo.",
  "..odm..mdo..",
  "o..odmmdo..o",
  ".o..ollo..o.",
  "..oomllmoo..",
  "....ollo....",
  "....otto....",
  "....otto....",
  "....otto....",
  "....otto....",
  "...ooooo....",
]);
spr("boulder", { o: "#191a1a", d: "#4a4c4a", m: "#65685f", l: "#7e8177" }, [
  "............",
  "...oooooo...",
  "..odmmmllo..",
  ".odmmmmlllo.",
  ".odmmmmmllo.",
  "odmmmmmmlllo",
  "odmmmmmmmllo",
  ".odddmmmllo.",
  "..oddddllo..",
  "...oooooo...",
  "............",
  "............",
]);
spr("ore", { o: "#191a1a", d: "#4d4438", m: "#6d6250", l: "#8a7c62",
             g: "#c08a3e", y: "#e0b93c" }, [
  "............",
  "...oooooo...",
  "..odmgmllo..",
  ".odmgymmllo.",
  ".odmgymmllo.",
  "odmmgymmlllo",
  "odmmmgyymllo",
  ".odddmgymlo.",
  "..oddddllo..",
  "...oooooo...",
  "............",
  "............",
]);

/* --- animals, top-down. Small, but they have to be tellable apart at a
   glance, which is the only thing that matters at this size. --- */
spr("chicken", { o: "#191a14", w: "#e8e4d8", g: "#c9c4b4", r: "#c2452f",
                 y: "#d9a13a" }, [
  "............",
  "............",
  "....oro.....",
  "...owwo.....",
  "..owwwwo....",
  ".owwwwggo...",
  ".owwwggggo..",
  ".owwggggo...",
  "..ooggoo....",
  "...oy.yo....",
  "............",
  "............",
]);
spr("sheep", { o: "#1a1a16", w: "#ece7dc", g: "#cdc7b8", f: "#3a352c" }, [
  "............",
  "...oooooo...",
  "..owwwwwwo..",
  ".owwwwwwwwo.",
  "owwwwwwwwffo",
  "owwwwwwwwffo",
  ".owwwwwwwfo.",
  "..ogwwwwgo..",
  "..o.o..o.o..",
  "............",
  "............",
  "............",
]);
spr("goat", { o: "#1a1a16", w: "#cbbba2", g: "#a8967c", f: "#3f382c" }, [
  "............",
  "...ooooo.o..",
  "..owwwwwoo..",
  ".owwwwwwwfo.",
  "owwwwwwwffo.",
  "owwwwwwwfo..",
  ".ogwwwwwo...",
  "..ogwwwgo...",
  "..o.o.o.o...",
  "............",
  "............",
  "............",
]);
spr("pig", { o: "#1a1614", w: "#dfa9a0", g: "#c28d86", f: "#9c6f6a" }, [
  "............",
  "...oooooo...",
  "..owwwwwwo..",
  ".owwwwwwwwo.",
  "owwwwwwwwffo",
  "owwwwwwwwffo",
  ".owwwwwwwfo.",
  "..ogwwwwgo..",
  "..o.o..o.o..",
  "............",
  "............",
  "............",
]);
spr("cow", { o: "#151512", w: "#e4e0d4", d: "#3a332b", g: "#c3bfb2",
             p: "#c98f86" }, [
  "..ooooooo...",
  ".owwwddwwo..",
  "owwddwwwwwo.",
  "owwddwwwwppo",
  "owwwwwddwppo",
  "owwwwwddwwpo",
  "owwddwwwwwo.",
  ".owwwwwddo..",
  "..ogwwwwgo..",
  "..o.o..o.o..",
  "............",
  "............",
]);

/* Paint a sprite into a cached canvas at native pixel size.
   Cached because a colonist's drawing never changes and re-rasterising 168
   pixels per person per frame would be silly. `flip` mirrors horizontally,
   which is why there is no west-facing drawing: it is the east one, backwards,
   exactly as every 2D game since 1985 has done it. */
const _sprCache = new Map();
function sprite(name, subs, flip) {
  const key = (subs ? name + "|" + Object.values(subs).join(",") : name)
            + (flip ? "|f" : "");
  let c = _sprCache.get(key);
  if (c) return c;
  const d = SPR[name];
  if (!d) return null;
  c = document.createElement("canvas");
  c.width = d.w; c.height = d.h;
  const g = c.getContext("2d");
  const pal = subs ? Object.assign({}, d.pal, subs) : d.pal;
  for (let y = 0; y < d.h; y++) {
    const row = d.rows[y];
    for (let x = 0; x < row.length; x++) {
      const ch = row[x];
      if (ch === "." || ch === " ") continue;
      const col = pal[ch];
      if (!col) continue;
      g.fillStyle = col;
      g.fillRect(flip ? d.w - 1 - x : x, y, 1, 1);
    }
  }
  _sprCache.set(key, c);
  return c;
}

/* Which drawing an object gets. Species names come from the simulation, so a
   spruce really is drawn as a spire and an oak as a broad crown. */
function treeSprite(species, height) {
  if (/palm|kapok|mangrove/.test(species)) return "palm";
  if (/pine|spruce|fir|conifer|juniper/.test(species)) return "conifer";
  if (height != null && height < 3.5) return "shrub";
  return "broadleaf";
}

/* Deterministic per-pawn colouring, so a given colonist always looks the
   same and you can recognise them across the map without reading a label. */
const SKINS = ["#f0c9a2","#e0ac7e","#d9a374","#b97f52","#8d5a35","#6b4326"];
const HAIRS = ["#2a1d13","#3b2a1c","#5b3a1e","#8a5a2b","#b58b4c","#d8cfc0",
               "#7a2f1c","#1b1b1b"];
const COATS = ["#7d6a4f","#5e6b52","#6b5560","#4f6470","#7a5a3c","#59604a",
               "#7b4a4a","#464f5c"];
function pawnLook(a) {
  let n = 0;
  for (let i = 0; i < a.name.length; i++) n = (n * 31 + a.name.charCodeAt(i)) | 0;
  n = n < 0 ? -n : n;
  return { s: SKINS[n % SKINS.length],
           h: HAIRS[(n >> 3) % HAIRS.length],
           c: COATS[(n >> 7) % COATS.length] };
}

/* ---------------------------------------------------------------- data --- */

async function loadSite() {
  const d = await api("/api/site");
  d.terrainA = unb64(d.terrain);
  d.objA     = unb64(d.obj);
  d.objhA    = unb64(d.objh);
  d.yA       = new Int16Array(unb64(d.y).buffer);
  S.site = d; S.size = d.size;
  bake();
  mark();
}

async function loadStatus() {
  const d = await api("/api/status");
  S.status = d.status; S.actors = d.actors; S.animals = d.animals || [];
  S.structures = d.structures; S.fields = d.fields;
  paint(); mark();
}

/* Ground texture.

   A tile used to be one flat pixel, which at forty pixels a tile is forty
   pixels of exactly the same brown -- the map read as a spreadsheet with a
   colour scheme. Each tile is now baked at BAKE_PX subpixels a side with a
   surface pattern that belongs to its material: grass gets tufts, gravel gets
   angular chips, sand gets fine grain, water gets ripple bands running with
   the shore. It is still one image and still one blit, so it costs memory
   (a 160 m site is 960 x 960) and nothing per frame.

   The patterns are deterministic functions of world position, like everything
   else here, so the ground does not shimmer when you pan. */
const BAKE_PX = 6;

/* A cheap 2D hash in [0,1). The same trick the terrain generator uses, so
   the texture is stable and cannot disagree with itself between bakes. */
function h2(x, y) {
  let n = (x * 73856093) ^ (y * 19349663);
  n = (n ^ (n >>> 13)) * 1274126177;
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

/* How a material looks up close: returns a brightness multiplier for one
   subpixel. Kept as arithmetic rather than image data so there is nothing to
   load and nothing to go missing from the bundle. */
function grain(kind, gx, gy, r) {
  switch (kind) {
    case "grass": {                       // tufts, standing more or less up
      const blade = h2(gx, (gy / 2) | 0);
      return 0.86 + 0.30 * blade + (r < 0.10 ? 0.14 : 0);
    }
    case "rich_soil":
    case "soil":
    case "mud":
    case "packed": {                      // clods, with the odd stone in it
      const clod = h2((gx / 2) | 0, (gy / 2) | 0);
      return 0.84 + 0.26 * clod + (r > 0.94 ? 0.18 : 0);
    }
    case "sand":
      return 0.94 + 0.12 * r;             // fine, so almost flat
    case "gravel":
    case "scree":
    case "road": {                        // angular chips with lit faces
      const chip = h2((gx / 2) | 0, (gy / 2) | 0);
      return 0.78 + 0.44 * chip;
    }
    case "rock":
    case "cliff": {
      const face = h2((gx / 3) | 0, (gy / 3) | 0);
      return 0.74 + 0.50 * face;
    }
    case "snow":
    case "ice":
      return 0.96 + 0.09 * r;
    case "marsh":
      return 0.88 + 0.24 * h2(gx, (gy / 3) | 0);
    case "deep_water":
    case "water":
    case "shallows": {                    // ripple bands
      const band = Math.sin(gy * 0.9 + gx * 0.35) * 0.5 + 0.5;
      return 0.90 + 0.16 * band + 0.06 * r;
    }
    case "concrete":
      return 0.96 + 0.07 * r;
    case "floor": {                       // board joints
      return (gy % 3 === 0) ? 0.82 : 0.98 + 0.04 * r;
    }
    default:
      return 0.92 + 0.16 * r;
  }
}

function bake() {
  const v = S.site, n = v.size, B = BAKE_PX, N = n * B;
  baked = document.createElement("canvas");
  baked.width = N; baked.height = N;
  bakedCtx = baked.getContext("2d");
  const img = bakedCtx.createImageData(N, N);
  const px = img.data;
  const order = S.legend.terrain_order;
  const terrRGB = order.map(k => S.legend.terrain[k].rgb);
  const objRGB = {};
  for (const k in S.legend.objects) objRGB[k] = S.legend.objects[k].rgb;

  for (let j = 0; j < n; j++) {
    for (let i = 0; i < n; i++) {
      const k = j * n + i;
      const tid = v.terrainA[k];
      const kind = order[tid];
      let c = terrRGB[tid];

      // Hillshade: relief is invisible on flat colour, and this is a game
      // where a six-degree slope decides where the water goes.
      let f = 1;
      if (i > 0 && j > 0) {
        const dx = v.yA[k] - v.yA[k-1], dz = v.yA[k] - v.yA[k-n];
        f = clamp(1 + (dx * 0.9 + dz * 0.9) / 240, 0.58, 1.42);
      }
      // Coarse patchiness on top of the fine grain. Per-subpixel noise alone
      // averages out to a flat wash at any distance -- real ground varies at
      // the scale of a few metres as well as a few centimetres, and it is the
      // larger scale the eye actually reads as "ground".
      f *= 0.90 + 0.20 * (h2((i / 3) | 0, (j / 3) | 0) * 0.6
                          + h2((i / 9) | 0, (j / 9) | 0) * 0.4);

      const o = v.objA[k];
      if (o) {
        const oc = objRGB[o] || [120,120,120];
        // Blend the object into the base so the zoomed-out map still reads
        // as forest / rock / built-up without drawing a single shape, and
        // softly enough that it does not fight the sprite drawn over it.
        const w = (o === 1 || o === 6) ? 0.42 : (o === 2 ? 0.22 : 0.70);
        c = [c[0]*(1-w)+oc[0]*w, c[1]*(1-w)+oc[1]*w, c[2]*(1-w)+oc[2]*w];
      }

      for (let sy = 0; sy < B; sy++) {
        const gy = j * B + sy;
        let p = (gy * N + i * B) * 4;
        for (let sx = 0; sx < B; sx++, p += 4) {
          const gx = i * B + sx;
          const g = f * grain(kind, gx, gy, h2(gx, gy));
          px[p]   = clamp(c[0]*g, 0, 255);
          px[p+1] = clamp(c[1]*g, 0, 255);
          px[p+2] = clamp(c[2]*g, 0, 255);
          px[p+3] = 255;
        }
      }
    }
  }
  bakedCtx.putImageData(img, 0, 0);
}

/* --------------------------------------------------------------- render -- */

function resize() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.max(1, r.width * dpr | 0);
  cv.height = Math.max(1, r.height * dpr | 0);
  mark();
}

function frame() {
  if (S.dirty && S.legend && S.site) { S.dirty = false; draw(); }
  requestAnimationFrame(frame);
}

function draw() {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = "#0b0f0b";
  ctx.fillRect(0,0,cv.width,cv.height);
  if (S.plane === "xz") drawTop(); else drawSection();
  drawScaleBar();
}

function visibleRange() {
  const s = S.scale;
  return {
    x0: Math.max(0, Math.floor(S.camX)),
    z0: Math.max(0, Math.floor(S.camZ)),
    x1: Math.min(S.size, Math.ceil(S.camX + cv.width / s) + 1),
    z1: Math.min(S.size, Math.ceil(S.camZ + cv.height / s) + 1),
  };
}

function drawTop() {
  const s = S.scale, v = S.site;

  // One blit for the entire terrain. This is the whole performance story.
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(baked, -S.camX * s, -S.camZ * s, v.size * s, v.size * s);

  // Beyond the site edge.
  ctx.fillStyle = "rgba(8,11,8,.86)";
  const ex = (v.size - S.camX) * s, ez = (v.size - S.camZ) * s;
  if (ex < cv.width)  ctx.fillRect(ex, 0, cv.width - ex, cv.height);
  if (ez < cv.height) ctx.fillRect(0, ez, cv.width, cv.height - ez);
  if (S.camX < 0) ctx.fillRect(0, 0, -S.camX * s, cv.height);
  if (S.camZ < 0) ctx.fillRect(0, 0, cv.width, -S.camZ * s);

  const R = visibleRange();

  // Detail only when tiles are big enough for a shape to add anything. Below
  // that the object tint baked into the image already reads as forest or rock,
  // and drawing three thousand separate arcs per frame does not.
  if (s >= 8) drawObjectLayer(R, s);
  // The metre grid is a measuring aid, not decoration. Once the ground has a
  // texture of its own a grid at every tile just makes it look like a
  // spreadsheet again, so it comes in later and much fainter.
  if (s >= 26) drawGrid(R, s);
  drawFields(s);
  drawBuildings(s);
  drawAnimals(s);
  drawActors(s);
  if (S.sel) {
    ctx.strokeStyle = "#e0b93c"; ctx.lineWidth = 2;
    ctx.strokeRect((S.sel.x - S.camX) * s, (S.sel.z - S.camZ) * s, s, s);
  }
}

/* The object layer, in two modes.

   Above SPRITE_ZOOM every tree, rock and seam is a drawn sprite, which is
   what makes the map look like a place rather than a scatter plot. Below it
   they go back to one batched path per class: at eight pixels a tile a sprite
   is illegible anyway, and there can be twenty thousand of them on screen. */
const SPRITE_ZOOM = 11;
const OBJ_SPRITE = { 1: "broadleaf", 2: "shrub", 3: "boulder", 4: "ore",
                     6: "conifer" };

function drawObjectLayer(R, s) {
  if (s >= SPRITE_ZOOM) { drawObjectSprites(R, s); return; }
  const v = S.site;
  const buckets = new Map();
  for (let z = R.z0; z < R.z1; z++) {
    const row = z * v.size;
    for (let x = R.x0; x < R.x1; x++) {
      const o = v.objA[row + x];
      if (!o) continue;
      let b = buckets.get(o);
      if (!b) { b = []; buckets.set(o, b); }
      b.push(x, z, v.objhA[row + x]);
    }
  }
  for (const [code, list] of buckets) {
    ctx.fillStyle = rgb(S.legend.objects[code].rgb);
    ctx.beginPath();
    for (let i = 0; i < list.length; i += 3) {
      const px = (list[i] - S.camX) * s, py = (list[i+1] - S.camZ) * s;
      const h = list[i+2] / 10;
      const cx = px + s/2, cy = py + s/2;
      if (code === 1 || code === 6) {
        const r = Math.max(1.2, s * 0.34 * clamp(h/18, 0.5, 1.5));
        ctx.moveTo(cx + r, cy); ctx.arc(cx, cy, r, 0, 6.284);
      } else if (code === 2) {
        const r = Math.max(.8, s * 0.19);
        ctx.moveTo(cx + r, cy); ctx.arc(cx, cy, r, 0, 6.284);
      } else if (code === 5) {
        ctx.rect(px + .5, py + .5, s - 1, s - 1);
      } else if (code === 4) {
        ctx.rect(cx - s*0.24, cy - s*0.24, s*0.48, s*0.48);
      } else {
        const r = Math.max(1, s * 0.26);
        ctx.moveTo(cx + r, cy); ctx.arc(cx, cy, r, 0, 6.284);
      }
    }
    ctx.fill();
  }
}

function drawObjectSprites(R, s) {
  const v = S.site;
  ctx.imageSmoothingEnabled = false;
  // Back to front, so a tree in front overlaps the one behind it and the
  // canopy reads as depth rather than as a grid of stamps.
  for (let z = R.z0; z < R.z1; z++) {
    const row = z * v.size;
    for (let x = R.x0; x < R.x1; x++) {
      const code = v.objA[row + x];
      if (!code || code === 5) continue;         // buildings draw themselves
      const name = OBJ_SPRITE[code];
      if (!name) continue;
      const img = sprite(name);
      if (!img) continue;
      // Trees are drawn taller than their tile, anchored at the trunk, so a
      // 22 m oak towers over a 2 m bush the way it should.
      const h = v.objhA[row + x] / 10;
      const grow = (code === 1 || code === 6)
        ? clamp(0.9 + h / 26, 0.9, 2.1)
        : (code === 2 ? 0.85 : 0.95);
      const w = s * grow, ht = w * img.height / img.width;
      const px = (x - S.camX) * s + s / 2 - w / 2;
      const py = (z - S.camZ) * s + s - ht;
      ctx.drawImage(img, px, py, w, ht);
    }
  }
}

function drawObjTop(px, py, s, code, h) {
  const c = px + s/2, m = py + s/2;
  ctx.fillStyle = rgb(S.legend.objects[code].rgb);
  if (code === 1 || code === 6) {
    const r = Math.max(1.2, s * 0.34 * clamp(h/18, 0.5, 1.5));
    ctx.beginPath(); ctx.arc(c, m, r, 0, 6.284); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.28)";
    ctx.beginPath(); ctx.arc(c + r*0.3, m + r*0.3, r*0.55, 0, 6.284); ctx.fill();
  } else if (code === 2) {
    ctx.beginPath(); ctx.arc(c, m, Math.max(.8, s*0.19), 0, 6.284); ctx.fill();
  } else if (code === 5) {
    ctx.fillRect(px+.5, py+.5, s-1, s-1);
    ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.lineWidth = 1;
    ctx.strokeRect(px+.5, py+.5, s-1, s-1);
  } else if (code === 4) {
    ctx.fillRect(c - s*0.24, m - s*0.24, s*0.48, s*0.48);
  } else {
    ctx.beginPath(); ctx.arc(c, m, Math.max(1, s*0.26), 0, 6.284); ctx.fill();
  }
}

function drawGrid(R, s) {
  ctx.strokeStyle = "rgba(0,0,0,.10)"; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = R.x0; x <= R.x1; x++) {
    const p = Math.round((x - S.camX) * s) + .5;
    ctx.moveTo(p, 0); ctx.lineTo(p, cv.height);
  }
  for (let z = R.z0; z <= R.z1; z++) {
    const p = Math.round((z - S.camZ) * s) + .5;
    ctx.moveTo(0, p); ctx.lineTo(cv.width, p);
  }
  ctx.stroke();
}

function drawFields(s) {
  ctx.lineWidth = Math.max(1.5, s * 0.14);
  for (const f of S.fields) {
    const x = (f.x - S.camX) * s, z = (f.z - S.camZ) * s;
    ctx.strokeStyle = f.ripe ? "#e8cf5c" : "rgba(190,210,130,.85)";
    ctx.setLineDash(f.crop ? [] : [6, 5]);
    ctx.strokeRect(x, z, f.w * s, f.h * s);
    ctx.setLineDash([]);
    if (s >= 3) {
      const label = f.crop ? `${f.crop} ${(f.progress*100)|0}%` : "field (unsown)";
      ctx.font = "600 12px system-ui,sans-serif";
      const w = ctx.measureText(label).width;
      ctx.fillStyle = "rgba(10,14,10,.8)";
      ctx.fillRect(x, z - 19, w + 12, 17);
      ctx.fillStyle = "#e8cf5c";
      ctx.fillText(label, x + 6, z - 6);
    }
  }
}

/* Buildings, drawn rather than sprited because their footprints differ and a
   fixed drawing would either stretch or tile badly. A roof plane, a ridge, a
   door and a shadow is enough to read as a building at any size, and it lets
   an unfinished one show its frame. */
const ROOFS = {
  cabin:["#7a4f31","#8f5e3a"], longhouse:["#7a4f31","#8f5e3a"],
  shelter:["#5d5636","#6d6540"], byre:["#6b4a2e","#7d5837"],
  coop:["#6b4a2e","#7d5837"], granary:["#8a6a3c","#9d7a46"],
  cold_store:["#4f5a5e","#5d6a6e"], workshop:["#6a5940","#7b684b"],
  machine_shop:["#4f5551","#5d635e"], watchtower:["#6a5940","#7b684b"],
  windmill:["#7a6a4a","#8c7a56"], hearth:["#54514a","#6a655c"],
  kitchen:["#6f5b42","#81694c"], well:["#4d5560","#5b6470"],
  cistern:["#4d5560","#5b6470"], kiln:["#5e5148","#6f5f54"],
  smelter:["#554943","#655750"], sawpit:["#6a5940","#7b684b"],
  palisade:["#5c4a33","#6c583d"], generator:["#4f5551","#5d635e"],
};
function drawBuildings(s) {
  if (!S.structures) return;
  for (const b of S.structures) {
    const side = b.side || 1;
    const px = (b.x - S.camX) * s, pz = (b.z - S.camZ) * s;
    const w = side * s;
    if (px + w < -20 || pz + w < -20 || px > cv.width + 20 || pz > cv.height + 20)
      continue;
    const pal = ROOFS[b.kind] || ["#6a5940", "#7b684b"];
    if (!b.done) {
      // A frame with nothing on it yet, and a progress bar, because "what is
      // being built and how far along" is a question you ask constantly.
      ctx.strokeStyle = "#8d967f"; ctx.lineWidth = Math.max(1, s * 0.08);
      ctx.setLineDash([s * 0.35, s * 0.25]);
      ctx.strokeRect(px + 1, pz + 1, w - 2, w - 2);
      ctx.setLineDash([]);
      ctx.fillStyle = "rgba(224,185,60,.75)";
      ctx.fillRect(px + 2, pz + w - 5, (w - 4) * b.progress, 3);
      continue;
    }
    ctx.fillStyle = "rgba(0,0,0,.30)";
    ctx.fillRect(px + s * 0.18, pz + s * 0.22, w, w);
    // A gable roof seen from above: two slopes meeting at a horizontal ridge
    // across the middle, the far one lit and the near one shaded. Drawing it
    // as a triangle to a centre point instead made every building look like a
    // cardboard box with a Y felt-tipped on it.
    const mid = pz + w * 0.46;
    ctx.fillStyle = pal[1];
    ctx.fillRect(px, pz, w, mid - pz);
    ctx.fillStyle = pal[0];
    ctx.fillRect(px, mid, w, pz + w - mid);
    if (b.roofed) {
      ctx.strokeStyle = "rgba(255,255,255,.16)";
      ctx.lineWidth = Math.max(1, s * 0.07);
      ctx.beginPath(); ctx.moveTo(px, mid); ctx.lineTo(px + w, mid); ctx.stroke();
      // Rafter lines down both slopes, at roughly a metre apart.
      if (s >= 12) {
        ctx.strokeStyle = "rgba(0,0,0,.16)"; ctx.lineWidth = 1;
        ctx.beginPath();
        for (let t = s; t < w; t += s) {
          ctx.moveTo(px + t, pz); ctx.lineTo(px + t, pz + w);
        }
        ctx.stroke();
      }
    }
    ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.lineWidth = 1;
    ctx.strokeRect(px + .5, pz + .5, w - 1, w - 1);
    if (s >= 10 && b.roofed) {                       // a door on the south face
      ctx.fillStyle = "#2a2119";
      ctx.fillRect(px + w * 0.42, pz + w - Math.max(2, s * 0.26),
                   Math.max(2, w * 0.16), Math.max(2, s * 0.26));
    }
  }
}

/* Animals next, so a colonist standing in the byre is drawn in front of the
   cow rather than behind it. */
function drawAnimals(s) {
  if (!S.animals || !S.animals.length) return;
  ctx.imageSmoothingEnabled = false;
  for (const a of S.animals) {
    const px = (a.x - S.camX) * s, pz = (a.z - S.camZ) * s;
    if (px < -40 || pz < -40 || px > cv.width + 40 || pz > cv.height + 40) continue;
    const img = sprite(SPR[a.kind] ? a.kind : "sheep");
    if (!img) continue;
    // Young stock is visibly smaller, which is most of what you want to know
    // when you glance at a herd.
    // Roughly to scale against a colonist: a cow is a couple of metres of
    // animal, a hen is a bird.
    const g = (a.young ? 0.62 : 1.0) * (a.kind === "cow" ? 1.25 :
              a.kind === "chicken" ? 0.55 :
              a.kind === "pig" ? 0.95 : 0.85);
    const w = s * g, h = w * img.height / img.width;
    ctx.globalAlpha = a.thin ? 0.75 : 1;
    ctx.drawImage(img, px + s/2 - w/2, pz + s - h, w, h);
    ctx.globalAlpha = 1;
  }
}

function drawActors(s) {
  const r = Math.max(3.2, s * 0.44);
  ctx.imageSmoothingEnabled = false;
  for (const a of S.actors) {
    const x = (a.x - S.camX) * s + s/2, z = (a.z - S.camZ) * s + s/2;
    if (x < -30 || z < -30 || x > cv.width + 30 || z > cv.height + 30) continue;
    ctx.beginPath(); ctx.ellipse(x, z + r*0.62, r*0.8, r*0.42, 0, 0, 6.284);
    ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.fill();

    // Which way are they walking? Facing is the cheapest possible animation
    // and it does an enormous amount of work: a settlement where everyone is
    // turned towards what they are doing reads as busy.
    const dx = (a.tx == null ? a.x : a.tx) - a.x;
    const dz = (a.tz == null ? a.z : a.tz) - a.z;
    let name = "man_s", flip = false;
    if (Math.abs(dx) > Math.abs(dz)) { name = "man_e"; flip = dx < 0; }
    else if (dz < 0) name = "man_n";

    const look = pawnLook(a);
    if (a.down) { look.c = "#8a3f31"; look.s = "#b48a6a"; }
    else if (a.hurt) look.c = "#9a6a3a";
    const img = sprite(name, look, flip);
    const w = Math.max(9, s * 0.92), h = w * img.height / img.width;
    ctx.drawImage(img, x - w/2, z - h * 0.62, w, h);

    if (a.down) {                          // a downed colonist needs to shout
      ctx.fillStyle = "#d15f45";
      ctx.beginPath(); ctx.arc(x, z - h*0.72, Math.max(2, s*0.12), 0, 6.284);
      ctx.fill();
    }
    // Only the person under the cursor is labelled. Labelling all of them
    // turns a working settlement into an unreadable stack of overlapping
    // captions, which is exactly what it did.
    if (a === S.hover) {
      const nm = `${a.name} — ${a.job}`;
      ctx.font = "600 12px system-ui,sans-serif";
      const w = ctx.measureText(nm).width;
      ctx.fillStyle = "rgba(10,14,10,.92)";
      ctx.fillRect(x - w/2 - 7, z - r - 24, w + 14, 19);
      ctx.strokeStyle = "#e0b93c"; ctx.lineWidth = 1;
      ctx.strokeRect(x - w/2 - 7, z - r - 24, w + 14, 19);
      ctx.fillStyle = "#e4e8dc"; ctx.textAlign = "center";
      ctx.fillText(nm, x, z - r - 10);
      ctx.textAlign = "start";
    }
  }
  // If everyone is off screen, point at them.
  if (S.actors.length && !S.actors.some(a => {
    const x = (a.x - S.camX) * S.scale, z = (a.z - S.camZ) * S.scale;
    return x > 0 && z > 0 && x < cv.width && z < cv.height;
  })) drawOffscreenArrow();
}

function drawOffscreenArrow() {
  const a = S.actors[0];
  const cx = cv.width/2, cy = cv.height/2;
  const tx = (a.x - S.camX) * S.scale, tz = (a.z - S.camZ) * S.scale;
  const ang = Math.atan2(tz - cy, tx - cx);
  const rr = Math.min(cv.width, cv.height) * 0.36;
  const px = cx + Math.cos(ang)*rr, py = cy + Math.sin(ang)*rr;
  ctx.save(); ctx.translate(px, py); ctx.rotate(ang);
  ctx.fillStyle = "#e0b93c";
  ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(-10,9); ctx.lineTo(-10,-9);
  ctx.closePath(); ctx.fill(); ctx.restore();
  ctx.fillStyle = "#e0b93c"; ctx.font = "600 12px system-ui,sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("your people — press C", px, py + 30);
  ctx.textAlign = "start";
}

/* ------------------------------------------------------- cross-sections -- */

function drawSection() {
  const v = S.site, s = S.scale, n = v.size;
  const along = S.plane === "xy" ? "X" : "Z";
  const groundY = cv.height * 0.68;
  const cam = S.plane === "xy" ? S.camX : S.camZ;
  const ox = -cam * s;

  const g = ctx.createLinearGradient(0, 0, 0, groundY);
  g.addColorStop(0, "#141d2c"); g.addColorStop(1, "#37465f");
  ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, groundY);

  const idxOf = i => S.plane === "xy" ? (S.slice * n + i) : (i * n + S.slice);

  let sum = 0;
  for (let i = 0; i < n; i++) sum += v.yA[idxOf(i)];
  const meanCm = sum / n;

  const soilPx = Math.max(2, (v.soil_depth_cm / 100) * s);
  for (let i = 0; i < n; i++) {
    const px = ox + i * s;
    if (px + s < 0 || px > cv.width) continue;
    const k = idxOf(i);
    const top = groundY - (v.yA[k] - meanCm) / 100 * s;
    const base = S.legend.terrain[S.legend.terrain_order[v.terrainA[k]]];

    const grad = ctx.createLinearGradient(0, top, 0, top + soilPx);
    grad.addColorStop(0, rgb(base.rgb));
    grad.addColorStop(1, shade(base.rgb, .55));
    ctx.fillStyle = grad; ctx.fillRect(px, top, s + 1, soilPx);
    ctx.fillStyle = shade([98,94,90], .6 + ((i*37)%7)*.012);
    ctx.fillRect(px, top + soilPx, s + 1, cv.height - top - soilPx);

    if (base.water) {
      ctx.fillStyle = "rgba(80,140,190,.6)";
      ctx.fillRect(px, top - s*0.6, s + 1, s*0.6);
    }
    const o = v.objA[k], oh = v.objhA[k] / 10;
    if (o && oh > 0) drawObjSide(px, top, s, o, oh);
  }

  const edge = ox + n * s;
  ctx.fillStyle = "rgba(8,11,8,.8)";
  if (edge < cv.width) ctx.fillRect(edge, 0, cv.width - edge, cv.height);
  if (ox > 0) ctx.fillRect(0, 0, ox, cv.height);

  for (const a of S.actors) {
    const across = S.plane === "xy" ? a.z : a.x;
    if (across !== S.slice) continue;
    const i = S.plane === "xy" ? a.x : a.z;
    const top = groundY - (v.yA[idxOf(i)] - meanCm) / 100 * s;
    const hp = a.height_m * s;
    ctx.fillStyle = a.down ? "#d15f45" : "#f4f7ea";
    ctx.fillRect(ox + i*s + s*0.28, top - hp, Math.max(1.6, s*0.44), hp);
  }

  ctx.strokeStyle = "rgba(228,232,220,.14)";
  ctx.fillStyle = "rgba(228,232,220,.62)";
  ctx.font = "11px ui-monospace,monospace"; ctx.lineWidth = 1;
  for (let k = -8; k <= 12; k++) {
    const y = groundY - k * 5 * s;
    if (y < 0 || y > cv.height) continue;
    ctx.beginPath(); ctx.moveTo(0, y+.5); ctx.lineTo(cv.width, y+.5); ctx.stroke();
    ctx.fillText(`${(meanCm/100 + k*5).toFixed(0)} m`, 6, y - 3);
  }
  ctx.fillStyle = "rgba(228,232,220,.8)";
  ctx.font = "12px system-ui,sans-serif";
  ctx.fillText(`${along} axis · Y is up · 1 tile = 1 m · `
    + `${S.site.soil_name}, ${(v.soil_depth_cm/100).toFixed(2)} m of soil over bedrock`,
    8, cv.height - 12);
}

function drawObjSide(px, top, s, code, h) {
  const col = S.legend.objects[code].rgb, cx = px + s/2, hp = h * s;
  if (code === 6) {
    ctx.fillStyle = "#3d2f1e";
    ctx.fillRect(cx - Math.max(.5, s*.07), top - hp*.22, Math.max(1, s*.14), hp*.22);
    ctx.fillStyle = rgb(col);
    const w = Math.max(2, s*1.5);
    ctx.beginPath(); ctx.moveTo(cx, top - hp);
    ctx.lineTo(cx + w, top - hp*.12); ctx.lineTo(cx - w, top - hp*.12);
    ctx.closePath(); ctx.fill();
  } else if (code === 1) {
    ctx.fillStyle = "#4a3a24";
    ctx.fillRect(cx - Math.max(.5, s*.08), top - hp*.55, Math.max(1, s*.16), hp*.55);
    ctx.fillStyle = rgb(col);
    ctx.beginPath();
    ctx.ellipse(cx, top - hp*.72, Math.max(2, s*1.5), Math.max(2.5, hp*.32), 0, 0, 6.284);
    ctx.fill();
  } else if (code === 2) {
    ctx.fillStyle = rgb(col);
    ctx.beginPath();
    ctx.ellipse(cx, top - hp*.5, Math.max(1.2, s*.5), Math.max(1.2, hp*.5), 0, 0, 6.284);
    ctx.fill();
  } else {
    ctx.fillStyle = rgb(col);
    ctx.fillRect(px + s*.1, top - hp, s*.8, hp);
  }
}

function drawScaleBar() {
  const want = 130 / S.scale;
  const nice = [1,2,5,10,20,50,100,200].reduce((a,b) =>
    Math.abs(b-want) < Math.abs(a-want) ? b : a);
  document.getElementById("scalebar").innerHTML =
    `${nice} m<i style="width:${nice*S.scale}px"></i>`;
}

/* --------------------------------------------------------------- panels -- */

const bar = (v, invert) => {
  const p = clamp(v, 0, 1), q = invert ? 1-p : p;
  const c = q < .25 ? "var(--bad)" : q < .5 ? "var(--hot)" : "var(--good)";
  return `<div class="bar"><i style="width:${(p*100).toFixed(0)}%;background:${c}"></i></div>`;
};
const stat = (label, value, frac) =>
  `<div class="stat"><div class="lab"><span class="dim">${label}</span>
   <span>${value}</span></div>${bar(frac)}</div>`;
const row = (k, v) => `<div class="row"><span class="dim">${k}</span><span>${v}</span></div>`;

function paint() {
  const st = S.status; if (!st) return;
  const s = st.site, c = st.colony, w = st.weather, pl = st.place;

  const bits = [pl.region, pl.peak && "near " + pl.peak, pl.river && "river: " + pl.river]
    .filter(Boolean).join(" · ");
  document.getElementById("where").innerHTML =
    `<b>${esc(s.biome)}</b><span>${Math.abs(s.lat).toFixed(3)}°${s.lat>=0?"N":"S"} `
    + `${Math.abs(s.lon).toFixed(3)}°${s.lon>=0?"E":"W"} · ${esc(s.koppen)}`
    + (bits ? " · " + esc(bits) : "") + `</span>`;

  document.getElementById("clock").textContent = st.clock.text;
  document.getElementById("wx").textContent =
    `${w.temp_c>0?"+":""}${w.temp_c}°C${w.raining?" 🌧":w.snowing?" ❄":""} · indoors ${w.indoor_c}°C`;

  document.getElementById("objectives").innerHTML = st.objectives.map(o =>
    `<div class="obj u-${o.urgency}"><div class="tag">${o.urgency}</div>
     <div><div class="t">${esc(o.title)}</div><div class="w">${esc(o.why)}</div></div></div>`).join("");

  document.getElementById("colony").innerHTML =
    row("people", `${c.population}${c.dead ? ` <span class="dim">(${c.dead} lost)</span>` : ""}`) +
    `<div style="height:8px"></div>` +
    stat("food", `${c.food_days} days`, c.food_days/200) +
    stat("fuel", `${c.fuel_days} days`, c.fuel_days/120) +
    stat("water", `${c.water_days} days`, c.water_days/5) +
    stat("morale", `${(c.morale*100)|0}%`, c.morale) +
    row("beds", `${c.beds} / ${c.population}`
        + (c.beds < c.population
           ? ` <span style="color:var(--bad)">crowded</span>` : "")) +
    (c.children ? row("children", c.children) : "") +
    (c.ill ? row("ill", `<span style="color:var(--bad)">${c.ill}</span>`) : "") +
    row("water", c.water_safe ? "boiled" :
        `<span style="color:var(--hot)">untreated</span>`) +
    row("livestock", esc(c.herd)) +
    `<div class="dim" style="margin-top:8px;font-size:11.5px">${esc(c.stores)}</div>`;

  // The roster. A colony is easier to care about when you can see that Kaia
  // is nineteen, is Tomas's daughter, is your best doctor, and has influenza.
  document.getElementById("people").innerHTML = (st.people || []).map(p => {
    const flags = [];
    if (p.ill.length) flags.push(`<span style="color:var(--bad)">${esc(p.ill.join(", "))}</span>`);
    if (p.hurt) flags.push(`<span style="color:var(--hot)">${p.hurt} injured</span>`);
    if (p.pregnant) flags.push(`<span style="color:var(--blue)">expecting</span>`);
    const sub = [p.child ? "child" : p.best_skill, p.traits.slice(0,2).join(", ")]
      .filter(Boolean).join(" · ");
    return `<div class="pers" title="${esc(p.ties.join("; ") || "no strong ties")}">
      <div class="pn"><b>${esc(p.name)}</b> <span class="dim">${p.age}</span>
        <i>${esc(p.job)}</i></div>
      <div class="dim">${esc(sub)}${flags.length ? " · " + flags.join(" · ") : ""}</div>
      ${p.ties.length ? `<div class="ties">${esc(p.ties[0])}</div>` : ""}
    </div>`;
  }).join("");

  document.getElementById("site").innerHTML =
    row("soil", s.soil) + row("climate", s.koppen) +
    row("site", `${s.size_m} × ${s.size_m} m, 1 m tiles`) +
    `<div class="dim" style="margin-top:6px;font-size:11px">Earth has ${s.earth_tiles} m². `
    + `You can see ${(s.size_m*s.size_m).toLocaleString()} of them.</div>`;

  document.getElementById("standings").innerHTML = st.standings.map(f =>
    `<tr class="${f.player?"me":""}"><td>${f.glyph}</td><td>${esc(f.name)}</td>
     <td class="dim">${esc(f.doctrine)}</td><td>${f.settlements}</td><td>${f.population}</td>
     <td class="dim">${f.relation===null?"you":(f.relation>0?"+":"")+f.relation}</td></tr>`).join("");

  document.getElementById("intel").innerHTML = st.intel.length
    ? st.intel.map(t => `<div>${esc(t)}</div>`).join("")
    : `<div>nothing intercepted yet</div>`;
  document.getElementById("log").innerHTML =
    st.log.slice().reverse().map(t => `<div>${esc(t)}</div>`).join("");

  if (st.over) {
    document.getElementById("over").hidden = false;
    document.getElementById("overT").textContent = "The run is over";
    document.getElementById("overP").textContent = st.outcome;
  }
}

function paintLegend() {
  const items = [["grass","grass"],["soil","soil"],["rich_soil","rich soil"],
    ["mud","mud"],["gravel","gravel"],["rock","rock"],["sand","sand"],
    ["water","water"],["marsh","marsh"],["snow","snow"]];
  let h = items.map(([k,n]) =>
    `<div><i style="background:${rgb(S.legend.terrain[k].rgb)}"></i>${n}</div>`).join("");
  h += [[1,"broadleaf"],[6,"conifer"],[2,"shrub"],[3,"boulder"],[4,"ore"],[5,"building"]]
    .map(([k,n]) => `<div><i style="background:${rgb(S.legend.objects[k].rgb)}"></i>${n}</div>`).join("");
  document.getElementById("legend").innerHTML = h;
}

async function inspect(x, z) {
  S.sel = {x, z}; mark();
  const t = await api(`/api/tile?x=${x}&z=${z}`);
  document.getElementById("tilesec").hidden = false;
  document.getElementById("tile").innerHTML =
    row("X / Z", `${t.x}, ${t.z}`) +
    row("Y (elevation)", `${t.elevation_m} m`) +
    row("on Earth", `<span class="mono" style="font-size:11px">${t.lat}, ${t.lon}</span>`) +
    row("terrain", t.terrain) + (t.object ? row("on it", t.object) : "") +
    row("fertility", t.fertility) + row("walk", `${t.walk_s} s/m`) +
    row("cover", `${(t.cover*100)|0}%`);
}

/* --------------------------------------------------------------- minimap - */

async function loadMinimap() {
  const d = await api("/api/minimap");
  const mc = document.getElementById("mini");
  const mx = mc.getContext("2d");
  const img = mx.createImageData(d.w, d.h);
  const raw = unb64(d.rgb);
  for (let i = 0, p = 0; i < d.w*d.h; i++) {
    img.data[p++] = raw[i*3]; img.data[p++] = raw[i*3+1];
    img.data[p++] = raw[i*3+2]; img.data[p++] = 255;
  }
  mx.putImageData(img, 0, 0);
  for (const m of d.marks) {
    if (m.player) continue;
    mx.fillStyle = "#d15f45";
    mx.beginPath(); mx.arc(m.x, m.y, 2.4, 0, 6.284); mx.fill();
  }
  mx.strokeStyle = "#0b0f0b"; mx.lineWidth = 2;
  mx.beginPath(); mx.arc(d.you[0], d.you[1], 4.6, 0, 6.284); mx.stroke();
  mx.fillStyle = "#e0b93c";
  mx.beginPath(); mx.arc(d.you[0], d.you[1], 4.2, 0, 6.284); mx.fill();
}

/* ---------------------------------------------------------------- input -- */

function setPlane(p) {
  S.plane = p;
  for (const b of document.querySelectorAll("#planes button"))
    b.setAttribute("aria-pressed", String(b.dataset.plane === p));
  document.getElementById("btnCentre").hidden = (p !== "xz");
  mark();
}

function centreOnPeople() {
  if (!S.actors.length) return;
  let ax = 0, az = 0;
  for (const a of S.actors) { ax += a.x; az += a.z; }
  ax /= S.actors.length; az /= S.actors.length;
  // Zoom in enough that people are people rather than three pixels.
  if (S.scale < 13) S.scale = 13;
  S.camX = ax - cv.width / S.scale / 2;
  S.camZ = az - cv.height / S.scale / 2;
  clampCam(); mark();
}

function clampCam() {
  const vw = cv.width / S.scale, vh = cv.height / S.scale;
  S.camX = clamp(S.camX, -4, Math.max(0, S.size - vw) + 4);
  S.camZ = clamp(S.camZ, -4, Math.max(0, S.size - vh) + 4);
}

function zoomAt(f, sx, sy) {
  const before = { x: S.camX + sx / S.scale, z: S.camZ + sy / S.scale };
  S.scale = clamp(S.scale * f, 1.5, 44);
  S.camX = before.x - sx / S.scale;
  S.camZ = before.z - sy / S.scale;
  clampCam(); mark();
}

let drag = null;
cv.addEventListener("pointerdown", e => {
  drag = { x:e.clientX, y:e.clientY, cx:S.camX, cz:S.camZ, moved:0 };
  cv.setPointerCapture(e.pointerId); cv.classList.add("dragging");
});
cv.addEventListener("pointermove", e => {
  if (!drag) return;
  const r = cv.getBoundingClientRect(), dpr = cv.width / r.width;
  const dx = (e.clientX - drag.x) * dpr / S.scale, dy = (e.clientY - drag.y) * dpr / S.scale;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  S.camX = drag.cx - dx; S.camZ = drag.cz - dy;
  clampCam(); mark();
});
cv.addEventListener("pointermove", e => {
  if (drag || S.plane !== "xz" || !S.actors.length) return;
  const r = cv.getBoundingClientRect(), dpr = cv.width / r.width;
  const mx = S.camX + (e.clientX - r.left) * dpr / S.scale;
  const mz = S.camZ + (e.clientY - r.top) * dpr / S.scale;
  let best = null, bd = 4.5;
  for (const a of S.actors) {
    const d = Math.hypot(a.x + .5 - mx, a.z + .5 - mz);
    if (d < bd) { bd = d; best = a; }
  }
  if (best !== S.hover) { S.hover = best; mark(); }
});

cv.addEventListener("pointerup", e => {
  cv.classList.remove("dragging");
  if (drag && drag.moved < 0.6 && S.plane === "xz") {
    const r = cv.getBoundingClientRect(), dpr = cv.width / r.width;
    const x = Math.floor(S.camX + (e.clientX - r.left) * dpr / S.scale);
    const z = Math.floor(S.camZ + (e.clientY - r.top) * dpr / S.scale);
    if (x >= 0 && z >= 0 && x < S.size && z < S.size) inspect(x, z);
  }
  drag = null;
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), dpr = cv.width / r.width;
  zoomAt(e.deltaY < 0 ? 1.18 : 0.85,
         (e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr);
}, { passive:false });

addEventListener("keydown", e => {
  if (!S.legend) return;
  const k = e.key.toLowerCase(), pan = Math.max(3, 40 / S.scale);
  if (k === "tab") {
    e.preventDefault();
    const ids = S.legend.planes.map(p => p.id);
    setPlane(ids[(ids.indexOf(S.plane) + 1) % ids.length]);
  }
  else if (k === "a" || k === "arrowleft")  { S.camX -= pan; clampCam(); mark(); }
  else if (k === "d" || k === "arrowright") { S.camX += pan; clampCam(); mark(); }
  else if (k === "w" || k === "arrowup")    { S.camZ -= pan; clampCam(); mark(); }
  else if (k === "s" || k === "arrowdown")  { S.camZ += pan; clampCam(); mark(); }
  else if (k === "c") centreOnPeople();
  else if (k === "+" || k === "=") zoomAt(1.25, cv.width/2, cv.height/2);
  else if (k === "-" || k === "_") zoomAt(0.8, cv.width/2, cv.height/2);
  else if (k === "[") { S.slice = clamp(S.slice-1, 0, S.size-1); mark(); }
  else if (k === "]") { S.slice = clamp(S.slice+1, 0, S.size-1); mark(); }
});

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.style.display = "none", 5000);
}

async function advance(minutes, label) {
  if (S.busy) return;
  S.busy = true;
  const btns = ["step","day","week"].map(i => document.getElementById(i));
  btns.forEach(b => b.disabled = true);
  const was = document.getElementById("day").textContent;
  document.getElementById("day").textContent = "…" + label;
  try {
    const r = await api("/api/advance", {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({ minutes }) });
    await Promise.all([loadStatus(), loadSite()]);
    if (r.battles && r.battles.length) toast("⚔ " + r.battles.join(" · "));
  } catch (err) { toast("error: " + err.message); }
  finally {
    S.busy = false; btns.forEach(b => b.disabled = false);
    document.getElementById("day").textContent = was;
  }
}
document.getElementById("step").onclick = () => advance(60, "1h");
document.getElementById("day").onclick  = () => advance(1440, "1d");
document.getElementById("week").onclick = () => advance(1440*7, "7d");
document.getElementById("btnCentre").onclick = centreOnPeople;
document.getElementById("mini").onclick = () => toast(
  "The gold dot is you. Red dots are rival networks. "
  + "Everything you can walk to is inside the site you are looking at.");

addEventListener("resize", () => { resize(); clampCam(); });

/* --------------------------------------------------------------- briefing */

function showBriefing() {
  const st = S.status, s = st.site, c = st.colony, pl = st.place;
  const rivals = st.standings.filter(f => !f.player);
  const where = [pl.region, pl.peak && "near " + pl.peak].filter(Boolean).join(", ")
    || `${Math.abs(s.lat).toFixed(1)}°${s.lat>=0?"N":"S"}`;
  document.getElementById("briefBody").innerHTML = `
    <h1>You are a Steward.</h1>
    <p class="dim">2041. The networks went down two years ago and the logistics
    AIs that ran the supply chains did not. They kept optimising, with nobody
    left to optimise for. You are one of them. So are ${rivals.length} others,
    on this continent, wanting the same rivers.</p>
    <h3>Where you are</h3>
    <div class="kv">
      <span class="dim">Place</span><b>${esc(where)}</b>
      <span class="dim">Ground</span><b>${esc(s.biome)}, ${esc(s.soil)}</b>
      <span class="dim">Climate</span><b>${esc(s.koppen)}</b>
      <span class="dim">Coordinates</span><b class="mono">${Math.abs(s.lat).toFixed(3)}°${s.lat>=0?"N":"S"} ${Math.abs(s.lon).toFixed(3)}°${s.lon>=0?"E":"W"}</b>
      <span class="dim">Your people</span><b>${c.population}</b>
      <span class="dim">Food</span><b>${c.food_days} days</b>
    </div>
    <h3>What you are doing</h3>
    <p>Keep these ${c.population} people alive, and outgrow the rivals. Nobody
    dies of a health bar here — they die of <em>hunger</em>, <em>cold</em>,
    <em>thirst</em>, <em>infection</em> and <em>scurvy</em>, each on its own
    clock. The panel on the right always says which one is closest.</p>
    <h3>How to play</h3>
    <p><b>Time only moves when you move it.</b> Press <em>+1 day</em> and watch
    what happens. Read <em>What to do next</em>, then advance again.
    Drag to pan, scroll to zoom, click any tile to see what it is and where on
    Earth it is. <em>Tab</em> switches between the top-down view and the two
    elevation views.</p>
    <p style="margin-top:20px"><button class="primary" id="briefGo"
       style="font-size:14px;padding:10px 20px">Start</button></p>`;
  document.getElementById("brief").hidden = false;
  document.getElementById("briefGo").onclick = () => {
    document.getElementById("brief").hidden = true;
    centreOnPeople();
  };
}

/* ------------------------------------------------------------------ start */

(async function start() {
  try {
    resize();
    S.legend = await api("/api/legend");
    const box = document.getElementById("planes");
    for (const p of S.legend.planes) {
      const b = document.createElement("button");
      b.textContent = p.id === "xz" ? "Top-down  X/Z"
                    : p.id === "xy" ? "Elevation  X/Y" : "Elevation  Z/Y";
      b.title = p.label + "  (Tab)";
      b.dataset.plane = p.id;
      b.onclick = () => setPlane(p.id);
      box.appendChild(b);
    }
    paintLegend();
    await loadStatus();
    await loadSite();
    S.slice = Math.floor(S.size / 2);
    setPlane("xz");
    centreOnPeople();
    loadMinimap();
    document.getElementById("loading").remove();
    showBriefing();
    frame();
    window.__pegReady = true;
  } catch (err) {
    document.getElementById("loading").textContent = "failed to start: " + err.message;
    console.error(err);
  }
})();
</script>
